    <path d="M323 83 C324.4 90.6 324.4 90.6 332 92 C324.4 93.4 324.4 93.4 323 101
             C321.6 93.4 321.6 93.4 314 92 C321.6 90.6 321.6 90.6 323 83 Z"/>
    <path d="M414 58 C432 62 442 74 440 90 C438 104 428 112 416 111
