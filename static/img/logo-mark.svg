<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" width="460" height="310"
     role="img" aria-label="ARMA">
  <title>ARMA</title>
  <defs>
    <linearGradient id="armaCopper" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A85A3E"/>
      <stop offset=".45" stop-color="#C87A57"/>
      <stop offset="1" stop-color="#F0BCA0"/>
    </linearGradient>
  </defs>

  <g fill="#1B4B5E" fill-rule="evenodd">
    <!-- A: tirsiz — kurdele onun orta xətti rolunu oynayır -->
    <path d="M150 120 L262 286 L200 286 L150 200 L100 286 L38 286 Z"/>
    <!-- M -->
    <path d="M262 286 L262 120 L306 120 L341 200 L376 120 L420 120 L420 286
             L378 286 L378 178 L352 238 L330 238 L304 178 L304 286 Z"/>
  </g>

  <!-- Mis kurdele: A-nın sol qolunu tam tutur, sonra sağa-yuxarı süzülüb
       böyük parıltının içində bitir. Ağ kontur onu teal A-dan ayırır. -->
  <path d="M38 286 L150 120 L134 172
           C200 100 285 52 373 58
           C320 92 235 128 114 238 L100 286 Z"
        fill="url(#armaCopper)" stroke="#ffffff" stroke-width="8"
        stroke-linejoin="round"/>

